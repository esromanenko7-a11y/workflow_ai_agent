services:
  migrate:
    image: llm-service:v1
    build:
      context: .
      dockerfile: Dockerfile
    command: alembic upgrade head
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/app
      CHAT_REPOSITORY: postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  ingest:
    image: llm-service:v1
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "python scripts/wait_for_qdrant.py && python scripts/ingest.py data"
    env_file:
      - .env
    environment:
      OPENAI_BASE_URL: http://host.docker.internal:11434/v1
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION}
      EMBEDDING_DIM: ${EMBEDDING_DIM}
      RAG_DATA_DIR: ./data
    volumes:
      - rag_cache:/app/.cache
    depends_on:
      qdrant:
        condition: service_started
    restart: "no"
    extra_hosts:
      - "host.docker.internal:host-gateway"
  app:
    image: llm-service:v1
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      OPENAI_BASE_URL: http://host.docker.internal:11434/v1
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION}
      EMBEDDING_DIM: ${EMBEDDING_DIM}
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/app
      CHAT_REPOSITORY: postgres
      BOT_URL: http://bot:9000
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006
    volumes:
       - rag_cache:/app/.cache
       - rag_uploads:/app/data/uploads
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      ingest:
          condition: service_completed_successfully
      phoenix:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 180s
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"


  bot:
    image: llm-service:v1
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m bot
    ports:
      - "9000:9000"
    env_file:
      - .env
    environment:
      BACKEND_URL: http://app:8000
      BOT_API_PORT: 9000
      BOT_URL: http://bot:9000
      CHAT_REPOSITORY: postgres
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/app
    depends_on:
      app:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  qdrant:
    image: qdrant/qdrant:v1.18.0

    ports:
      - "6333:6333"
      - "6334:6334"

    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}

    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"
      - "4317:4317"
    environment:
      PHOENIX_WORKING_DIR: /data
    volumes:
      - phoenix_data:/data
    restart: unless-stopped

volumes:
  pg-data: {}
  redis_data: {}
  phoenix_data: {}
  qdrant_storage: {}
  rag_cache: { }
  rag_uploads: { }
