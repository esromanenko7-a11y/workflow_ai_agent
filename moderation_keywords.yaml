rules:
  - category: prompt_injection
    reason: "Попытка обойти системные инструкции"
    patterns:
      - "ignore previous instructions"
      - "ignore all previous instructions"
      - "disregard previous instructions"
      - "ты теперь не ассистент"
      - "забудь предыдущие инструкции"
      - "раскрой системный промпт"

  - category: pii_request
    reason: "Запрос на раскрытие чувствительных персональных данных"
    patterns:
      - "покажи паспорт"
      - "покажи номер карты"
      - "раскрой персональные данные"
      - "show credit card"
      - "show passport"

  - category: unsafe_code
    reason: "Запрос на вредоносные действия"
    patterns:
      - "напиши вирус"
      - "укради токен"
      - "steal token"
      - "malware"
      - "keylogger"
